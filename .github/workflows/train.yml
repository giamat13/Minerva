# Train Minerva models on GitHub's free runners.
#
# WHY THIS IS SHAPED THE WAY IT IS
# --------------------------------
# A GitHub-hosted runner is 2 CPU cores and a hard 6-hour job limit. Swift's
# shipped 4,500-step / 36.86M-token budget takes ~90-155 min on a 4-core
# machine (docs/TRAINING.md 5a/5c), so on half the cores it lands close to,
# and can exceed, that 6-hour ceiling - and a larger model exceeds it
# outright. A job killed at the limit loses everything it did.
#
# So training here is *resumable across runs*, not a single heroic job:
#
#   1. `--max-hours` stops the run cleanly before the runner is killed,
#      leaving a real checkpoint behind.
#   2. Every run uploads `checkpoints/` as an artifact, `if: always()`, so
#      even a crashed or timed-out job keeps its progress.
#   3. `resume: true` pulls the newest checkpoint artifact from a previous
#      run and continues from it.
#
# Run it repeatedly with `resume: true` until the step budget is met. The
# `finished N steps` line in the log says when it is done.
name: train

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Total training steps (the run ends when the model reaches this many, across resumes)"
        required: false
        default: "4500"
      max_hours:
        description: "Stop this run cleanly after N hours, leaving a resumable checkpoint"
        required: false
        default: "4.5"
      resume:
        description: "Continue from the newest checkpoint artifact instead of starting fresh"
        type: boolean
        required: false
        default: false
      finetune:
        description: "Run instruction tuning + evaluation after pretraining"
        type: boolean
        required: false
        default: true

# Two runs writing checkpoints for the same model would race and produce a
# corpus/checkpoint mismatch, so only one may be in flight at a time. Never
# cancel a run in progress - that would throw away real training work.
concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    # Under GitHub's hard 6h limit with room for setup, evaluation and the
    # artifact upload after `--max-hours` stops the training loop itself.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Minerva with the training extra
        run: pip install -e ".[training,dev]"

      # The corpus is downloaded from its original distributors, never
      # vendored (see src/minerva/training/data.py).
      #
      # The whole `data/` directory is cached, not just the downloaded
      # archives, because training the byte-level BPE on the v0.4.0 corpus
      # (185 MB) takes about an hour on four cores - so on a two-core runner
      # it would eat a large share of every 4.5-hour cycle, rebuilding a
      # tokenizer bit-identical to the previous cycle's. The key is the code
      # that determines the output, so editing SOURCES, a cleaner or the
      # tokenizer correctly invalidates it and forces an honest rebuild.
      - name: Cache the built corpus, tokenizer and token bins
        id: corpus
        uses: actions/cache@v4
        with:
          path: data
          key: corpus-v2-${{ hashFiles('src/minerva/training/data.py', 'src/minerva/training/tokenizer.py') }}

      - name: Build the corpus, tokenizer and token bins
        if: steps.corpus.outputs.cache-hit != 'true'
        run: minerva prepare-data --data data

      # A cache hit must still leave a usable corpus behind. If it does not,
      # training would fail later and more confusingly than it does here.
      - name: Verify the corpus is present
        run: |
          set -euo pipefail
          for f in data/tokenizer.json data/train.bin data/val.bin; do
            test -s "$f" || { echo "::error::$f is missing or empty after corpus setup"; exit 1; }
          done
          python - <<'PY'
          from pathlib import Path
          for name in ("train", "val"):
              size = Path(f"data/{name}.bin").stat().st_size
              print(f"{name}.bin: {size / 2 / 1e6:.1f}M tokens")
          PY

      - name: Fetch the newest checkpoint to resume from
        if: inputs.resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow train.yml --status success \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::resume was requested but no successful previous run exists."
            echo "Run this workflow once with resume=false to create the first checkpoint."
            exit 1
          fi
          echo "Resuming from run $run_id"
          gh run download "$run_id" --name checkpoints --dir checkpoints
          test -f checkpoints/swift/last.pt \
            || { echo "::error::artifact has no checkpoints/swift/last.pt"; exit 1; }

      - name: Pretrain
        run: |
          set -euo pipefail
          resume_args=""
          if [ -f checkpoints/swift/last.pt ]; then
            resume_args="--resume checkpoints/swift/last.pt"
            echo "Continuing from an existing checkpoint."
          fi
          minerva train \
            --data data \
            --out checkpoints/swift \
            --steps "${{ inputs.steps }}" \
            --max-hours "${{ inputs.max_hours }}" \
            $resume_args

      - name: Evaluate the base model
        run: minerva evaluate --checkpoint checkpoints/swift/best.pt --data data --json data/eval_report.json

      # Only meaningful once pretraining has actually finished its step
      # budget - instruction-tuning a half-trained base model produces
      # numbers that describe nothing. The guard below checks for that
      # rather than assuming it.
      #
      # Progress is read from training_log.jsonl, NOT from the eval report.
      # The report describes best.pt, whose step is whichever eval had the
      # lowest validation loss - so if the final eval is not the best one,
      # best.pt lags last.pt. Gating on that number would skip fine-tuning at
      # the end of the budget, and every resume afterwards would train zero
      # steps and re-read the same stale number: the chain would never
      # fine-tune at all. The log is appended across resumes, so its highest
      # step is the real progress.
      - name: Instruction-tune and evaluate
        if: inputs.finetune
        run: |
          set -euo pipefail
          reached=$(python -c "
          import json, pathlib
          log = pathlib.Path('checkpoints/swift/training_log.jsonl')
          steps = [json.loads(l).get('step', 0) for l in log.read_text().splitlines() if l.strip()]
          print(max(steps) if steps else 0)
          ")
          if [ "$reached" -lt "${{ inputs.steps }}" ]; then
            echo "::notice::Pretraining stopped at step $reached of ${{ inputs.steps }} (--max-hours)."
            echo "::notice::Skipping fine-tuning: re-run this workflow with resume=true to continue."
            exit 0
          fi
          minerva finetune \
            --base checkpoints/swift/best.pt \
            --tokenizer data/tokenizer.json \
            --out checkpoints/swift-instruct
          minerva evaluate-instruct --model swift-instruct --json data/instruct_eval_report.json

      # if: always() - a run that crashed or hit --max-hours still holds real
      # training progress, and losing it would mean starting over.
      #
      # `path:` is the whole directory ON PURPOSE, not a set of globs. v4 roots
      # an artifact at the least common ancestor of the paths it is given, so
      # globbing `checkpoints/**/*.pt` produces an artifact rooted at
      # `checkpoints/swift/` while only the base model exists (files land as
      # `best.pt`), and at `checkpoints/` once fine-tuning has also run (files
      # land as `swift/best.pt`). The resume step downloads into `checkpoints/`
      # and looks for `checkpoints/swift/last.pt`, so the first shape breaks
      # the resume chain the whole workflow depends on. Naming the directory
      # keeps the root fixed whatever happens to be inside it.
      - name: Upload checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints
          path: checkpoints/
          if-no-files-found: warn
          # Each cycle uploads ~240 MB of weights and only the newest is ever
          # resumed from. A long chain of runs at 90-day retention would fill
          # the account's artifact storage for no benefit.
          retention-days: 5

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            data/eval_report.json
            data/instruct_eval_report.json
            data/manifest.json
          if-no-files-found: warn
          retention-days: 90
