# Train Minerva models on GitHub's free runners.
#
# WHY THIS IS SHAPED THE WAY IT IS
# --------------------------------
# A GitHub-hosted runner is 2 CPU cores and a hard 6-hour job limit. Swift's
# shipped 4,500-step / 36.86M-token budget takes ~90-155 min on a 4-core
# machine (docs/TRAINING.md 5a/5c), so on half the cores it lands close to,
# and can exceed, that 6-hour ceiling - and a larger model exceeds it
# outright. A job killed at the limit loses everything it did.
#
# So training here is *resumable across runs*, not a single heroic job:
#
#   1. `--max-hours` stops the run cleanly before the runner is killed,
#      leaving a real checkpoint behind.
#   2. Every run uploads `checkpoints/` as an artifact, `if: always()`, so
#      even a crashed or timed-out job keeps its progress.
#   3. `resume: true` pulls the newest checkpoint artifact from a previous
#      run and continues from it.
#
# Run it repeatedly with `resume: true` until the step budget is met. The
# `finished N steps` line in the log says when it is done.
name: train

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Total training steps (the run ends when the model reaches this many, across resumes)"
        required: false
        default: "4500"
      max_hours:
        description: "Stop this run cleanly after N hours, leaving a resumable checkpoint"
        required: false
        default: "4.5"
      resume:
        description: "Continue from the newest checkpoint artifact instead of starting fresh"
        type: boolean
        required: false
        default: false
      finetune:
        description: "Run instruction tuning + evaluation after pretraining"
        type: boolean
        required: false
        default: true
      chain:
        description: "Re-dispatch this workflow automatically until the step budget is met"
        type: boolean
        required: false
        default: true
      seed:
        description: >-
          Random seed. Deliberately NOT the local run's 1729: a different seed
          gives a different initialisation and a different data order, which is
          what makes these two runs independent enough to be worth averaging at
          the end. The same seed on both sides would produce one trajectory
          twice, and averaging an earlier point of a trajectory into a later
          one only moves the result backwards.
        required: false
        default: "2027"

# The chain step re-dispatches this workflow, which needs actions:write - the
# default GITHUB_TOKEN is read-only for Actions and the dispatch fails with
# "403 Resource not accessible by integration", which is exactly how the first
# v0.5.0 chain died after one job. workflow_dispatch is explicitly exempt from
# the rule that GITHUB_TOKEN-triggered events do not start new runs, so this
# is sufficient; a PAT is not needed.
permissions:
  contents: read
  actions: write

# Two runs writing checkpoints for the same model would race and produce a
# corpus/checkpoint mismatch, so only one may be in flight at a time. Never
# cancel a run in progress - that would throw away real training work.
concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    # Under GitHub's hard 6h limit with room for setup, evaluation and the
    # artifact upload after `--max-hours` stops the training loop itself.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Minerva with the training extra
        run: pip install -e ".[training,dev]"

      # The corpus is downloaded from its original distributors, never
      # vendored (see src/minerva/training/data.py).
      #
      # The whole `data/` directory is cached, not just the downloaded
      # archives, because training the byte-level BPE on the v0.4.0 corpus
      # (185 MB) takes about an hour on four cores - so on a two-core runner
      # it would eat a large share of every 4.5-hour cycle, rebuilding a
      # tokenizer bit-identical to the previous cycle's. The key is the code
      # that determines the output, so editing SOURCES, a cleaner or the
      # tokenizer correctly invalidates it and forces an honest rebuild.
      # Cached: the downloaded sources and the packed token bins, which is
      # what costs real time to reproduce (the v0.5.0 bulk fetch is thousands
      # of polite HTTP requests, and the BPE training is ~20 minutes). NOT
      # cached: data/train.txt, ~1.9 GB of intermediate text that the bins
      # already encode - GitHub caps a repo's cache at 10 GB, and keeping the
      # text as well would blow through it for no benefit.
      #
      # data/val.txt IS cached despite being text: `minerva evaluate` reads it
      # to report bits-per-byte, and excluding it alongside train.txt crashed
      # the evaluate step on every cache hit. It is 9.8 MB, not 1.9 GB.
      #
      # The key is the code that determines the output, so editing SOURCES, a
      # cleaner or the tokenizer correctly invalidates it and forces an honest
      # rebuild.
      - name: Cache the corpus sources, tokenizer and token bins
        id: corpus
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/tokenizer.json
            data/train.bin
            data/val.bin
            data/manifest.json
            data/val.txt
          key: corpus-v6-vocab16384-${{ hashFiles('src/minerva/training/data.py', 'src/minerva/training/tokenizer.py', 'data/gutenberg_bulk_ids.json') }}

      # The books are fetched by their own script rather than by the corpus
      # build: at this volume it is a long, resumable job, and a build that
      # silently started thousands of downloads would be a bad surprise. The
      # committed id list makes it fetch exactly the shipped set.
      - name: Fetch the bulk book set
        if: steps.corpus.outputs.cache-hit != 'true'
        run: python scripts/fetch_gutenberg_books.py

      # --vocab-size must match what the local run used. It defaults to 8192,
      # and leaving it unset trained CI on a 23.2M model with a 8,192-token
      # vocabulary while local trained a 26.8M model on 16,384 - two different
      # architectures, so the two checkpoints could never be compared, let
      # alone merged.
      - name: Build the corpus, tokenizer and token bins
        if: steps.corpus.outputs.cache-hit != 'true'
        run: minerva prepare-data --data data --vocab-size 16384

      # An older cache predates val.txt being cached, and `minerva evaluate`
      # reads it - which is how a run that trained 5,650 steps perfectly well
      # still ended in failure. Rebuilding it from val.bin is exact: the
      # tokenizer is lossless (tests/test_training_tokenizer.py asserts the
      # round trip, and it was checked against this very corpus), so this
      # recovers the file rather than approximating it, and costs seconds
      # instead of the two hours a cache-key bump would spend re-downloading
      # 4,382 books.
      - name: Restore val.txt if an older cache lacks it
        run: |
          set -euo pipefail
          if [ ! -s data/val.txt ] && [ -s data/val.bin ]; then
            echo "val.txt missing; decoding it back from val.bin"
            python - <<'PY'
          from pathlib import Path
          import numpy as np
          from minerva.training.tokenizer import BPETokenizer
          tok = BPETokenizer.load(Path("data/tokenizer.json"))
          ids = np.fromfile("data/val.bin", dtype=np.uint16).tolist()
          Path("data/val.txt").write_text(tok.decode(ids), encoding="utf-8")
          print(f"wrote data/val.txt ({len(ids):,} tokens)")
          PY
          fi

      # A cache hit must still leave a usable corpus behind. If it does not,
      # training would fail later and more confusingly than it does here.
      - name: Verify the corpus is present
        run: |
          set -euo pipefail
          for f in data/tokenizer.json data/train.bin data/val.bin; do
            test -s "$f" || { echo "::error::$f is missing or empty after corpus setup"; exit 1; }
          done
          python - <<'PY'
          from pathlib import Path
          for name in ("train", "val"):
              size = Path(f"data/{name}.bin").stat().st_size
              print(f"{name}.bin: {size / 2 / 1e6:.1f}M tokens")
          PY

      # Picks the newest run that still HAS a checkpoint, rather than the
      # newest *successful* one. Two reasons, both hit on the first day of the
      # v0.5.0 run:
      #
      #  * Checkpoints upload with `if: always()`, so a run that failed after
      #    training - the chain step's 403, say - holds real progress. Skipping
      #    it throws away hours of work.
      #  * Artifacts expire after retention-days. "Newest successful" happily
      #    resolved to a week-old run whose artifact had already expired, so
      #    the download failed; worse, had it not expired it would have been a
      #    9.9M checkpoint from before the architecture changed.
      #
      # So: walk recent runs newest-first and take the first whose checkpoints
      # artifact is present and unexpired. The trainer's own architecture guard
      # is the backstop if one slips through anyway.
      - name: Fetch the newest checkpoint to resume from
        if: inputs.resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          for candidate in $(gh run list --workflow train.yml --limit 20 \
              --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[].databaseId'); do
            usable=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" \
              --jq '[.artifacts[] | select(.name == "checkpoints" and .expired == false)] | length')
            if [ "$usable" -gt 0 ]; then
              run_id="$candidate"
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo "::error::resume was requested but no recent run has an unexpired checkpoints artifact."
            echo "Run this workflow once with resume=false to start a fresh checkpoint."
            exit 1
          fi
          echo "Resuming from run $run_id"
          gh run download "$run_id" --name checkpoints --dir checkpoints
          test -f checkpoints/swift/last.pt \
            || { echo "::error::artifact has no checkpoints/swift/last.pt"; exit 1; }

      - name: Pretrain
        run: |
          set -euo pipefail
          resume_args=""
          if [ -f checkpoints/swift/last.pt ]; then
            resume_args="--resume checkpoints/swift/last.pt"
            echo "Continuing from an existing checkpoint."
          fi
          minerva train \
            --data data \
            --out checkpoints/swift \
            --steps "${{ inputs.steps }}" \
            --max-hours "${{ inputs.max_hours }}" \
            --seed "${{ inputs.seed }}" \
            $resume_args

      - name: Evaluate the base model
        run: minerva evaluate --checkpoint checkpoints/swift/best.pt --data data --json data/eval_report.json

      # Only meaningful once pretraining has actually finished its step
      # budget - instruction-tuning a half-trained base model produces
      # numbers that describe nothing. The guard below checks for that
      # rather than assuming it.
      #
      # Progress is read from training_log.jsonl, NOT from the eval report.
      # The report describes best.pt, whose step is whichever eval had the
      # lowest validation loss - so if the final eval is not the best one,
      # best.pt lags last.pt. Gating on that number would skip fine-tuning at
      # the end of the budget, and every resume afterwards would train zero
      # steps and re-read the same stale number: the chain would never
      # fine-tune at all. The log is appended across resumes, so its highest
      # step is the real progress.
      - name: Instruction-tune and evaluate
        if: inputs.finetune
        run: |
          set -euo pipefail
          reached=$(python -c "
          import json, pathlib
          log = pathlib.Path('checkpoints/swift/training_log.jsonl')
          steps = [json.loads(l).get('step', 0) for l in log.read_text().splitlines() if l.strip()]
          print(max(steps) if steps else 0)
          ")
          if [ "$reached" -lt "${{ inputs.steps }}" ]; then
            echo "::notice::Pretraining stopped at step $reached of ${{ inputs.steps }} (--max-hours)."
            echo "::notice::Skipping fine-tuning: re-run this workflow with resume=true to continue."
            exit 0
          fi
          minerva finetune \
            --base checkpoints/swift/best.pt \
            --tokenizer data/tokenizer.json \
            --out checkpoints/swift-instruct
          minerva evaluate-instruct --model swift-instruct --json data/instruct_eval_report.json

      # if: always() - a run that crashed or hit --max-hours still holds real
      # training progress, and losing it would mean starting over.
      #
      # `path:` is the whole directory ON PURPOSE, not a set of globs. v4 roots
      # an artifact at the least common ancestor of the paths it is given, so
      # globbing `checkpoints/**/*.pt` produces an artifact rooted at
      # `checkpoints/swift/` while only the base model exists (files land as
      # `best.pt`), and at `checkpoints/` once fine-tuning has also run (files
      # land as `swift/best.pt`). The resume step downloads into `checkpoints/`
      # and looks for `checkpoints/swift/last.pt`, so the first shape breaks
      # the resume chain the whole workflow depends on. Naming the directory
      # keeps the root fixed whatever happens to be inside it.
      - name: Upload checkpoints
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints
          path: checkpoints/
          if-no-files-found: warn
          # Each cycle uploads ~240 MB of weights and only the newest is ever
          # resumed from. A long chain of runs at 90-day retention would fill
          # the account's artifact storage for no benefit.
          retention-days: 5

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            data/eval_report.json
            data/instruct_eval_report.json
            data/manifest.json
          if-no-files-found: warn
          retention-days: 90

      # A full pass over the v0.5.0 corpus at 23.2M parameters is far more
      # than one 6-hour job holds, so the chain re-dispatches itself rather
      # than asking a human to press the button thirty times. It stops on its
      # own the moment training_log.jsonl shows the step budget reached -
      # the same source the fine-tune gate reads, and for the same reason
      # (best.pt's step lags real progress).
      #
      # Guarded by `success()`: a failed run must NOT queue another, or a
      # broken build becomes an infinite loop burning the account's minutes.
      - name: Queue the next run if the budget is not met
        if: success() && inputs.chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reached=$(python -c "
          import json, pathlib
          log = pathlib.Path('checkpoints/swift/training_log.jsonl')
          if not log.exists():
              print(0)
          else:
              steps = [json.loads(l).get('step', 0)
                       for l in log.read_text().splitlines() if l.strip()]
              print(max(steps) if steps else 0)
          ")
          if [ "$reached" -ge "${{ inputs.steps }}" ]; then
            echo "::notice::Reached step $reached of ${{ inputs.steps }} - chain complete."
            exit 0
          fi
          echo "::notice::At step $reached of ${{ inputs.steps }}; queueing the next run."
          gh workflow run train.yml \
            -f steps="${{ inputs.steps }}" \
            -f max_hours="${{ inputs.max_hours }}" \
            -f resume=true \
            -f finetune="${{ inputs.finetune }}" \
            -f chain=true
