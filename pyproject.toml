[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minerva"
version = "0.1.0"
description = "Minerva - an AI model platform. First model: Swift."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Minerva" }]
keywords = ["llm", "ai", "ollama", "tool-calling", "agents"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
]

# Runtime dependencies are deliberately kept minimal.
# httpx is the only hard dependency: it gives us a real HTTP client with
# streaming support, connection pooling and timeouts. Everything else
# (JSON Schema generation, config parsing, CLI) is built on the stdlib.
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Training and running Minerva's own weights. Kept optional so that using the
# platform against an external engine stays a one-dependency install.
#
# pyarrow reads the Parquet files Hugging Face distributes datasets in (e.g.
# the Wikipedia source in training/data.py) - it is the format's standard
# library and the one datasets-server/HF's own `datasets` package use
# internally, not a bespoke choice for one file.
training = [
    "torch>=2.2",
    "numpy>=1.24",
    "pyarrow>=15",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "torch>=2.2",
    "numpy>=1.24",
    "pyarrow>=15",
]

[project.scripts]
minerva = "minerva.cli:main"

[project.urls]
Homepage = "https://github.com/giamat13/minerva"
Repository = "https://github.com/giamat13/minerva"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Tests that train or run Minerva's own weights; need the `training` extra.
    "torch: requires PyTorch",
    # Slow tests (real training steps, BPE training on real text).
    "slow: takes more than a few seconds",
    # Integration tests talk to a REAL engine (e.g. a running Ollama daemon).
    # They are skipped automatically when no engine is reachable - they are
    # never replaced by mocks. See tests/conftest.py.
    "integration: requires a real, reachable inference engine",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.isort]
# `conftest` is a test-local module, not third-party.
known-first-party = ["minerva", "conftest"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",
    # Hebrew note names (דו, רה, מי, ...) are a core feature of this project,
    # not accidental homoglyphs. RUF001/2/3 flag every one of them.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
packages = ["minerva"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

# pyarrow ships no py.typed marker / stubs of its own.
[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
